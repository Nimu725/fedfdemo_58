<!DOCTYPE html>
<html>
<head>
    <title>Three Column Layout</title>

    <link rel="stylesheet" href="style1.css">
</head>

<body>

    <!-- Header -->
    <div class="header">
        <h1>My Website</h1>
    </div>

    <!-- Main Body -->
    <div class="main">

        <!-- Left Division -->
        <div class="left">
            <h2>Left</h2>
            <p>Menu</p>
            <p>Home</p>
            <p>About</p>
            <p>Contact</p>
        </div>

        <!-- Center Division -->
        <div class="center">
            <h2>Center</h2>
            <p>
                This is the main content area.
            </p>
        </div>

        <!-- Right Division -->
        <div class="right">
            <h2>Right</h2>
            <p>Latest News</p>
            <p>Announcements</p>
        </div>

    </div>

    <!-- Footer -->
    <div class="footer">
        <p>© 2026 My Website</p>
    </div>

</body>
</html>
