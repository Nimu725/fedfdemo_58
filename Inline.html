<!DOCTYPE html>
<html>
<head>
    <title>Inline CSS</title>
</head>

<body>

    <h1 style="color: blue; text-align: center;">
        Welcome to KL University
    </h1>

    <p style="color: red; font-size: 20px;">
        This is an example of Inline CSS.<br>
        Inline CSS is used to apply styles directly<br>
        inside an HTML element using the style attribute.
    </p>

    <div style="background-color: yellow; padding: 20px;
     color: rgb(2, 2, 250); text-align: left; font-size: 36px; font-family: Arial, sans-serif ;">
        This is a DIV element.
    </div>

</body>
</html>
