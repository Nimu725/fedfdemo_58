<!DOCTYPE html>
<html>
<head>
    <title>HTML Multimedia Tags</title>
</head>
<body>

<h1>HTML Multimedia Tags Example</h1>
<hr>
<h2>1. Image</h2>
<img src="flower.jpg" alt="Flower" width="250">

<hr>

<h2>2. Audio</h2>
<audio controls>
    <source src="Sonthamalle.mp3" type="audio/mpeg">
    <source src="Sonthamalle.ogg" type="audio/ogg">
    Your browser does not support audio.
</audio>

<hr>

<h2>3. Video</h2>
<video width="500" controls>
    <source src="klu sample.mp4" type="video/mp4">
</video>

</body>
</html>
