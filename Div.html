<!DOCTYPE html>
<html>
<head>
    <title>DIV Tag Example</title>

    <style>
        .header {
            background-color: navy;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .content {
            background-color: lightgray;
            padding: 20px;
            margin: 10px;
        }

        .card {
            background-color: white;
            border: 1px solid gray;
            padding: 15px;
            margin: 10px;
        }

        .footer {
            background-color: black;
            color: white;
            padding: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- Header Section -->
    <div class="header">
        <h1>Student Management System</h1>
        <p>Welcome to the Student Portal</p>
    </div>

    <!-- Main Content -->
    <div class="content">

        <h2>Student Details</h2>

        <!-- Student Card 1 -->
        <div class="card">
            <h3>Ravi Kumar</h3>
            <p>University ID: 2200034567</p>
            <p>Course: Computer Science</p>
            <p>Year: 4th Year</p>
        </div>

        <!-- Student Card 2 -->
        <div class="card">
            <h3>Priya Sharma</h3>
            <p>University ID: 2200034568</p>
            <p>Course: Information Technology</p>
            <p>Year: 4th Year</p>
        </div>

    </div>

    <!-- Footer Section -->
    <div class="footer">
        <p>&copy; 2026 Student Management System</p>
    </div>

</body>
</html>
