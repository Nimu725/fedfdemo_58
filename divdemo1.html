<!DOCTYPE html>
<html lang="en">
<head>
    <title>Div Demo</title>
    <style>
        .header {
            background-color: #4CAF50;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            height: 100px;
        }
        .footer {
            background-color: #9b9797;
            padding: 10px;
            text-align: center;
            font-size: 20px;
            font-family: Arial, sans-serif;
        }
        .maincontainer {
            background-color: #f3f705;
            padding: 20px;
            text-align: left;
            font-size: 18px;
            height: 400px;
        }
        p {
            margin: 30px;
            text-align: center;
            text-decoration: underline;
            color: rgb(227, 243, 5);
            font-size: 30px;
        }
        .leftsidebar {
            background-color: #edeff3;
            width: 10%;
            float: left;
            height: 100%;
            font-size: 16px;
            color: white;
            text-align: center;
        }
        .centercontainer {
            background-color: #30bbe1;
            width: 75%;
            float: left;
            height: 100%;
            text
        }
        .rightsidebar {
            background-color: #d915cc;
            width: 15%;
            float: left;
            height: 100%;
            text
        }
    </style>

</head>
<body>
    <div class="header">
        <h1>Welcome to the Div Demo</h1>
    </div>
    <div class="maincontainer">
        <div class="leftsidebar">
            <p style="font-size: 10px; color: red; text-align: right; background-color: grey;">Left Sidebar content will be displayed here</p>
        </div>
        <div class="centercontainer">
            <p>Center Container</p>
        </div>
        <div class="rightsidebar">
            <p>Right Sidebar</p>
        </div>
    </div>
    <div class="footer">
        <p style="margin: 15px; text-align: center; color: crimson;"> footer section</p>
    </div>
</body>
</html>
