<!DOCTYPE html>
<html lang="en">
<head>
<style>
.container {
  display: flex;
  flex-direction: row-reverse;
  background-color: yellow;
  height: 100%;
  border: 2px solid red;
  
}

.container div {
  background-color: lightblue;
  margin: 10px;
  padding: 20px;
  font-size: 24px;
  text-align: center;
  border: 2px solid red;
}
</style>
</head>
<body>

<h1>Create a Flex/block/grid Container</h1>

<div class="container">
  <div>Item 1</div>
  <div>Item 2</div>
  <div>Item 3</div> 
  <div>Item 4</div> 
  <div>Item 5</div>
  <div>Item 6</div>
  <div>Item 7</div> 
  <div>Item 8</div> 
  <div>Item 9</div>
  <div>Item 10</div>
  <div>Item 11</div> 
  <div>Item 12 </div> 
</div>

<p>Flexbox must have a parent element with the display property set to flex or inline-flex.</p>
<p>Direct child elements of the flex container automatically becomes flex items.</p>

</body>
</html>
