<!DOCTYPE html>
<html>
<head>
    <title>Internal CSS</title>

    <style>
        h1 {
            color: blue;
            text-align: center;
        }

        p {
            color: green;
            font-size: 18px;
        }

        .box1 {
            background-color: lightyellow;
            border: 2px solid black;
            padding: 20px;
        }
        .box2 {
            background-color: lightblue;
            border: 2px solid black;
            padding: 20px;
        }
    </style>
</head>

<body>

    <h1>Welcome to CSS</h1>

    <p>This paragraph is styled using Internal CSS.</p>

    <div class="box1">
        This is a DIV styled using Internal CSS.
    </div><br><br>  
    <div class="box2">
        This is another DIV styled using Internal CSS.
    </div>  
</body>
</html>
